name: Build temporary UAsset CLI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone UAssetAPI
        run: git clone --depth 1 https://github.com/atenfyr/UAssetAPI.git tools/UAssetAPI
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Linux CLI
        run: dotnet publish tools/UAssetCli/UAssetCli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: uasset-cli-linux
          path: publish/UAssetCli
